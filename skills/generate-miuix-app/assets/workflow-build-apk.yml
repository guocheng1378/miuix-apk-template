# MIUIX 模板 Release 构建 workflow —— 模板
#
# 这是本仓库 .github/workflows/build-apk.yml 在 2026-09-02 的镜像，用作新项目起点。
# 仓库里那份是权威：两者不一致时以 .github/workflows/build-apk.yml 为准，
# 并顺手把这里同步过来（漂移的模板比没有模板更糟）。
#
# 派生新应用时要改的地方只有两处：
#   1. smoke job 的 APP_ID —— 必须与 app/build.gradle.kts 的 applicationId 一致
#   2. AVD 缓存 key —— 换 api-level/profile 时改一下，否则会命中不相干的旧快照
#
# 三条硬约束（改坏了不会报错，只会静默不干活）：
#   - 顶层 permissions: contents: write 不能删，否则创建 Release 403
#   - secrets.* 不能出现在 step 的 if: 里，否则整个 workflow 解析成 0 个 job
#   - 构建命令是 gradle 不是 ./gradlew，因为仓库没提交 wrapper jar

name: Build Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# 必需：softprops/action-gh-release 要用 GITHUB_TOKEN 创建 Release。
# 缺省权限只有 read，会返回 403 "Resource not accessible by integration"。
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # GitHub 托管 runner 已预装 Android SDK；setup-gradle 已提供与 AGP 9.x 匹配的
      # Gradle 9.x 并在 PATH 上，直接用 gradle 构建，避免现场生成 8.13 wrapper 造成版本错配。
      # 注意：secrets 上下文不能出现在 step 的 if: 里（会导致整个 workflow 解析失败）。
      # 因此在 shell 内部判断密钥是否存在；无密钥时跳过，release 产物为未签名 APK。
      - name: Decode signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "$SIGNING_KEY" | base64 -d > "$GITHUB_WORKSPACE/keystore.p12"
            echo "已写入 keystore.p12（PKCS12）"
          else
            echo "未配置 SIGNING_KEY，跳过签名，产物为 app-release-unsigned.apk"
          fi

      # KEYSTORE_PASS 对应 Secret KEYSTORE_PASSWORD —— 名字不一致是有意的，别改错边。
      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore.p12
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon

      # 签名没生效就直接让 CI 失败，避免把装不上的 unsigned 包发到 Release 页上。
      - name: Verify APK signature
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "产物: $APK"
          case "$APK" in
            *unsigned*) echo "!! 产物未签名，签名 Secrets 未生效"; exit 1;;
          esac
          AS=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          [ -n "$AS" ] || AS=$(find /usr/local/lib/android/sdk -name apksigner -type f 2>/dev/null | sort -V | tail -1)
          [ -n "$AS" ] || { echo "找不到 apksigner"; exit 1; }
          "$AS" verify --verbose --print-certs "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk

      # 仅当以 v* tag 触发时创建 GitHub Release 并附上 APK。
      # v3 相比 v2 主要是运行时升到 node24 并规范化 tag_name 输入；generate_release_notes
      # 让 GitHub 按提交历史自动写正文，省掉手工维护 changelog。
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true

  # 运行时冒烟：签名校验只证明「这个包是合法的」，不证明「装得上、起得来、不闪退」。
  # 本 job 在真头模拟器上安装 build 产出的同一个 APK 并拉起 MainActivity。
  #
  # 与 Release 的取舍（有意为之）：Create GitHub Release 是 build job 的最后一步，
  # smoke 通过 needs: build 排在它后面，所以冒烟失败时 Release 已经发出去了。
  # 这样做的理由是：APK 已经过 apksigner 校验，冒烟挂了通常是「运行环境/渲染」问题，
  # 不该把用户已经能下载的 Release 一起拖回未发布状态；但 smoke job 本身必须红，
  # 让页面上留下明确的失败信号。若哪天改成「冒烟不过就不发版」，把那个 Release 步骤
  # 挪进一个 needs: [build, smoke] 的 publish job 即可，这里先不做。
  smoke:
    name: Smoke test on emulator
    needs: build
    runs-on: ubuntu-latest
    # 无头模拟器最容易卡死（等不到 boot_completed），给一个远短于默认 360min 的上限。
    timeout-minutes: 45
    # 冒烟只读代码 + 下载 artifact，不需要写权限（artifact 走独立的运行时 token）。
    permissions:
      contents: read
    env:
      # 与 app/build.gradle.kts 的 applicationId 一致；改包名时这里要跟着改。
      APP_ID: top.yukonga.miuixapptemplate
      OUT_DIR: smoke-out

    steps:
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "21"

      # v8 相比 v7 只是内部迁移到 ESM，并把 digest 不匹配从「告警」改成「默认报错」——
      # 正好是我们想要的：冒烟测的必须是 build 原样产出的那个包，传输截断要直接红。
      - name: Download release APK
        uses: actions/download-artifact@v8
        with:
          name: app-release-apk
          path: smoke-apk

      # 拆成 restore/save 两步而不是单个 actions/cache：cache@v6 的 post 步骤带
      # post-if: success()，冒烟一挂就不会保存快照——而首次跑恰恰是最贵的一次
      # （要下 ~1GB system image 并冷启动生成快照），失败了也得把快照存下来。
      - name: Restore AVD snapshot
        id: avd-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-google_apis-x86_64-pixel_7_pro

      # 缓存未命中时先跑一次「只开机不测」的模拟器生成快照。
      # emulator-options 里不带 -no-snapshot，退出时才会保存快照；
      # 下一步再带 -no-snapshot-save，从快照启动但不覆盖它。
      - name: Create AVD and generate snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          cores: 2
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "已生成 AVD 快照用于缓存"

      # 冒烟逻辑写成独立脚本文件，而不是直接塞进 action 的 script: 输入。
      # 原因见 android-emulator-runner 的 src/script-parser.ts：script 会被
      # 按行拆成数组，每行单独跑一次 sh -c —— 跨行的 if/fi、case、变量全部失效。
      # 所以 script: 这里只能放一行调用。
      - name: Write smoke script
        run: |
          cat > "$RUNNER_TEMP/smoke.sh" <<'SMOKE_EOF'
          #!/usr/bin/env bash
          # 安装 → 预热（AOT + 抛弃式启动）→ 拉起 → 等渲染 → 截图 → 查崩溃。
          # 全程只收集证据，最后统一判定，这样即使中途失败，
          # artifact 里也有完整的现场可供排查。
          ADB="$(command -v adb || echo "$ANDROID_HOME/platform-tools/adb")"
          APK="$(find smoke-apk -name '*.apk' -type f | head -1)"

          if [ -z "$APK" ]; then
            echo "!! smoke-apk/ 下没有找到 APK，artifact 可能没上传成功"
            exit 1
          fi
          echo "冒烟对象: $APK"
          mkdir -p "$OUT_DIR"
          FAIL=0

          # 先清空 logcat：崩溃断言的窗口只覆盖「安装→预热→启动→渲染」这段，
          # 不把模拟器开机时其它系统进程的噪音算进来。预热因此落在窗口内：
          # 它自己要是还能闹出 ANR，说明 AOT 没生效、被测那次同样不可信，宁可红。
          "$ADB" logcat -c

          "$ADB" install -r -g "$APK" > "$OUT_DIR/install.log" 2>&1
          INSTALL_RC=$?
          cat "$OUT_DIR/install.log"
          if [ "$INSTALL_RC" -ne 0 ] || ! grep -qi "Success" "$OUT_DIR/install.log"; then
            echo "!! 安装失败（装不上）"; FAIL=1
          fi

          # ---- 预热：把冷 AVD 首启的 dexopt 成本提前付掉 ----
          # 实测对照：派生仓库 AVD 缓存未命中、现场新建那次，logcat 里
          # "Dexopt result ... actualCompilerFilter=verify, dex2oatWallTimeMillis=7387"，
          # am start 的 TotalTime 7653ms，随后 InputDispatcher "spent 6368ms processing
          # FocusEvent(hasFocus=true)" 撞上 5003ms 输入分发超时 → "ANR in <pkg>"，冒烟判红；
          # 同一份代码在缓存命中的模板仓库上 TotalTime 只有 4705ms，是绿的。差的这 ~3s
          # 全在首启现付的 verify 级解释执行上——那是环境冷启动慢，不是 app 缺陷，
          # 所以这里先把它跑掉，让真正被测的那次启动是热进程/热页缓存。
          # 位置：整段只能在 install 之后（cmd package compile 只对已安装的包有效）、
          # 判定用的那次 am start 之前。它落在 logcat -c 之后，也就是**在**崩溃断言窗口内——
          # 这是有意取舍：预热自己还能闹出 ANR，说明 AOT 根本没生效、被测那次同样不可信，
          # 宁可红。若想彻底排除预热日志的干扰，可在下面 force-stop 之后再补一次
          # logcat -c（含 -b crash -c），代价是断言窗口收窄、不再覆盖预热阶段。
          # 个别镜像上 cmd package compile 行为不一致，预热失败不该让冒烟直接红，
          # 但要把情况打印出来让人看见（真没热起来，下面那次启动的 ANR 仍照原样判红）。
          "$ADB" shell cmd package compile -m speed -f "$APP_ID" \
            || echo "!! AOT 预热未成功（rc=$?），首启可能仍是 verify 级，冒烟有假红风险"
          # 抛弃式启动：只为把解释执行、页缓存、类加载热一遍，成败不参与判定，
          # 只打印 TotalTime 供人对照（预热有效时应明显低于冷启的 7653ms）。
          "$ADB" shell am start -W -n "$APP_ID/$APP_ID.MainActivity" > "$OUT_DIR/warmup-start.log" 2>&1 || true
          echo "预热启动: $(grep -i 'TotalTime' "$OUT_DIR/warmup-start.log" || echo '未取到 TotalTime')"
          sleep 5
          "$ADB" shell am force-stop "$APP_ID" || true

          # -W 让 am 等到 activity 启动完成再返回，并打印 Status / TotalTime。
          "$ADB" shell am start -W -n "$APP_ID/$APP_ID.MainActivity" > "$OUT_DIR/am-start.log" 2>&1
          START_RC=$?
          cat "$OUT_DIR/am-start.log"
          if [ "$START_RC" -ne 0 ] || ! grep -qi "Status: ok" "$OUT_DIR/am-start.log"; then
            echo "!! am start 未返回 Status: ok（起不来）"; FAIL=1
          fi

          # Compose 首帧 + 模糊层建立需要一点时间，等它稳定后再取证。
          sleep 8

          # 截图判据不能只看非空：实测判红那次 screen.png 有 1440x3120、24472 bytes，
          # 但整屏按网格采样只有一个颜色 000000（ANR 后 activity 重启，截图正好撞在
          # 过渡帧上）；模板那次绿 run 是 355230 bytes 真内容。所以补一层「非单色空白屏」。
          "$ADB" exec-out screencap -p > "$OUT_DIR/screen.png"
          if [ ! -s "$OUT_DIR/screen.png" ]; then
            echo "!! screencap 输出为空"; FAIL=1
          else
            # runner 上不保证有 Pillow，只能用 python3 标准库（struct + zlib）自己解 PNG。
            # 这里是外层 <<'SMOKE_EOF' 里再套一个 <<'PY'：外层带引号所以整段原样落进
            # smoke.sh，运行时由 smoke.sh 自己的 heredoc 落成 .py 文件。两个分隔符不同名，
            # 嵌套合法。整段 python 与 heredoc 正文同级缩进 10 空格——YAML 块标量剥掉这层
            # 公共缩进之后，落到 smoke.sh 里正好是顶层语句顶格、嵌套块按 4 空格递进。
            cat > "$RUNNER_TEMP/blankpng.py" <<'PY'
          import sys, struct, zlib
          # 输出 "<唯一颜色数> <采样点数> <宽> <高>"；遇到解不动的变体输出 "SKIP <原因>" 并退 3。
          d = open(sys.argv[1], 'rb').read()
          if d[:8] != b'\x89PNG\r\n\x1a\n':
              print('SKIP not-a-PNG'); sys.exit(3)
          pos = 8; idat = b''; plte = b''; w = h = bd = ct = ilv = 0
          while pos + 8 <= len(d):
              ln = struct.unpack('>I', d[pos:pos + 4])[0]
              typ = d[pos + 4:pos + 8]; data = d[pos + 8:pos + 8 + ln]
              if typ == b'IHDR':
                  w, h, bd, ct, cm, fm, ilv = struct.unpack('>IIBBBBB', data[:13])
              elif typ == b'PLTE':
                  plte = data
              elif typ == b'IDAT':
                  idat += data
              elif typ == b'IEND':
                  break
              pos += 12 + ln
          if ilv or bd != 8 or ct not in (0, 2, 3, 4, 6) or w <= 0 or h <= 0:
              print('SKIP interlace=%d depth=%d colortype=%d' % (ilv, bd, ct)); sys.exit(3)
          ch = {0: 1, 2: 3, 3: 1, 4: 2, 6: 4}[ct]
          stride = w * ch
          raw = zlib.decompress(idat)
          prev = bytearray(stride)
          colors = set(); n = 0; o = 0; k = 0
          for y in range(h):
              f = raw[o]; o += 1
              line = bytearray(raw[o:o + stride]); o += stride
              if f:
                  # 逐字节还原 5 种 filter：Sub/Up/Average/Paeth 都依赖已还原的左邻与上一行，
                  # 所以必须整屏顺序解，不能跳行——这也是为什么只解码一次、采样另算。
                  for x in range(stride):
                      a = line[x - ch] if x >= ch else 0
                      b = prev[x]
                      c = prev[x - ch] if x >= ch else 0
                      if f == 1:
                          line[x] = (line[x] + a) & 255
                      elif f == 2:
                          line[x] = (line[x] + b) & 255
                      elif f == 3:
                          line[x] = (line[x] + (a + b) // 2) & 255
                      else:
                          pp = a + b - c
                          pa = abs(pp - a); pb = abs(pp - b); pc = abs(pp - c)
                          pr = a if (pa <= pb and pa <= pc) else (b if pb <= pc else c)
                          line[x] = (line[x] + pr) & 255
              prev = line
              if y % 40 == 0:
                  # 每 40 像素取一点，但逐行错开 17 的相位：固定网格会和周期规整的图案
                  # （例如 20px 棋盘）整步混叠，采出来全是同一种颜色，把真内容误判成空白屏。
                  for x in range((k * 17) % 40, w, 40):
                      i = x * ch
                      if ct == 3:
                          rgb = bytes(plte[line[i] * 3:line[i] * 3 + 3])
                      elif ct in (0, 4):
                          g = line[i]; rgb = bytes((g, g, g))
                      else:
                          rgb = bytes(line[i:i + 3])
                      colors.add(rgb); n += 1
                  k += 1
          print('%d %d %d %d' % (len(colors), n, w, h))
          PY
            PNG_BYTES="$(wc -c < "$OUT_DIR/screen.png")"
            PNG_STATS="$(python3 "$RUNNER_TEMP/blankpng.py" "$OUT_DIR/screen.png" 2>&1)"
            PNG_RC=$?
            UNIQ="$(printf '%s\n' "$PNG_STATS" | awk '{print $1}')"
            PTS="$(printf '%s\n' "$PNG_STATS" | awk '{print $2}')"
            case "$UNIQ" in
              ''|*[!0-9]*)
                # 解析器自己出问题（python 缺失、PNG 变体不认识）时退回旧的「非空」判据：
                # 判据退化只是少了一层保险，而在这里硬 FAIL 会把工具链问题算成 app 缺陷。
                echo "?? 截图未参与像素判定（rc=$PNG_RC，$PNG_STATS），按非空放行 $PNG_BYTES bytes";;
              *)
                if [ "$UNIQ" -le 1 ] || [ "${PTS:-0}" -lt 10 ]; then
                  echo "!! 截图是空白屏：$PNG_BYTES bytes，采样 ${PTS:-0} 点只有 $UNIQ 个唯一颜色（单色即判空）"
                  FAIL=1
                else
                  echo "截图: $OUT_DIR/screen.png $PNG_BYTES bytes / 唯一颜色 $UNIQ 个（采样 $PTS 点）"
                fi;;
            esac
          fi

          # 进程还在 = 没有启动即闪退；pidof 为空则基本是崩了或被系统杀掉。
          PID="$("$ADB" shell pidof "$APP_ID" | tr -d '\r')"
          if [ -n "$PID" ]; then
            echo "进程存活，pid=$PID"
          else
            echo "!! 启动后进程不存在（疑似闪退）"; FAIL=1
          fi

          # 前台 activity 仅作观测，不参与判定：dumpsys 字段格式随版本变化，
          # 拿它当硬断言容易造成假失败。
          "$ADB" shell dumpsys activity activities > "$OUT_DIR/dumpsys-activities.txt" 2>&1 || true
          grep -m 5 "$APP_ID" "$OUT_DIR/dumpsys-activities.txt" || echo "（dumpsys 中未匹配到包名，仅记录）"

          "$ADB" logcat -d -v time > "$OUT_DIR/logcat.txt" 2>&1 || true
          "$ADB" logcat -d -b crash > "$OUT_DIR/logcat-crash.txt" 2>&1 || true

          # 崩溃断言必须按归属过滤。logcat -c 只清掉了本 app 启动前的噪音，但窗口内
          # 其它进程照样会崩：run#14 就是被 nexuslauncher 的一条 ANR 判红的（当时 app
          # 安装成功、冷启 3.6s、进程存活），而同一 commit 的 run#13 是绿的——全 logcat
          # 通配等于把整机的事故算到本包头上，属于随机 flake。
          # 归属判定取三种形态，命中任一即算本 app：本行带包名（ANR in <pkg>）、下一行
          # 带 "Process: <pkg>"（FATAL EXCEPTION 的惯例）、tag 括号里的 pid 属于本 app。
          # 同时匹配 -v time 的 "E/AndroidRuntime" 和 threadtime 的 "E AndroidRuntime"。
          # 已知盲区：native crash 的 "Fatal signal" 行不带包名、pid 也随进程消失，这种
          # 情况会漏判；但那时上面的 pidof 检查必然为空并已 FAIL，不会因此放走真闪退。
          CRASH="$(awk -v app="$APP_ID" -v pids="$PID" '
            BEGIN { np = split(pids, pid, " ") }
            { line[NR] = $0 }
            END {
              for (i = 1; i <= NR; i++) {
                s = line[i]
                if (s !~ /FATAL EXCEPTION|Fatal signal|ANR in |E\/AndroidRuntime|E AndroidRuntime/) continue
                own = index(s, app) > 0 || index(line[i + 1], "Process: " app) > 0
                if (match(s, /\([ ]*[0-9]+\)/)) {
                  p = substr(s, RSTART + 1, RLENGTH - 2)
                  gsub(/[^0-9]/, "", p)
                  if (p != "") { for (k = 1; k <= np; k++) if (pid[k] == p) own = 1 }
                }
                if (own) printf "%d: %s\n", i, s
              }
            }' "$OUT_DIR/logcat.txt" || true)"
          if [ -n "$CRASH" ]; then
            echo "!! logcat 命中崩溃/ANR 特征："
            echo "$CRASH" | head -40
            FAIL=1
          fi

          if [ "$FAIL" -ne 0 ]; then
            echo "!! 冒烟未通过，证据见 smoke-evidence artifact"
            exit 1
          fi
          echo "冒烟通过：安装成功、activity 启动、进程存活、截图有内容、无崩溃"
          SMOKE_EOF
          chmod +x "$RUNNER_TEMP/smoke.sh"

      # api-level 取 34：本项目 minSdk 24，但 miuix-blur 在 Android 上要求 33
      # （manifest 里靠 tools:overrideLibrary 才过了合并检查），低于 33 根本走不到
      # 液态玻璃那条渲染路径，冒烟就没意义。34 也避开了 35 起的 16KB 页镜像变体。
      # arch 必须显式写 x86_64：该 action 默认 x86，而 android-34 已不再提供 x86 镜像
      # （Google 的 sys-img 清单里 android-34 只有 x86_64 和 arm64-v8a）。
      #
      # 关于截图：-gpu swiftshader_indirect 是软件光栅化，RenderEffect 模糊的质感、
      # 折射与真机 GPU 差异很大。所以 screen.png 只能用来断言「画没画出来 / 有没有崩」
      # （以及现在这层「不是单色空白屏」），不能当像素级视觉基线，也不要拿它做 diff 比对。
      - name: Install, launch and capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          cores: 2
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash "$RUNNER_TEMP/smoke.sh"

      # 无论成败都留证据：失败时这几份文件就是排查的全部依据。
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-evidence
          path: smoke-out/
          if-no-files-found: warn
          retention-days: 14

      - name: Save AVD snapshot
        if: always() && steps.avd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: ${{ steps.avd-cache.outputs.cache-primary-key }}
