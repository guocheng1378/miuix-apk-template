name: Build Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # GitHub 托管 runner 已预装 Android SDK；setup-gradle 已提供与 AGP 9.x 匹配的
      # Gradle 9.x 并在 PATH 上，直接用 gradle 构建，避免现场生成 8.13 wrapper 造成版本错配。
      # 注意：secrets 上下文不能出现在 step 的 if: 里（会导致整个 workflow 解析失败）。
      # 因此在 shell 内部判断密钥是否存在；无密钥时跳过，release 产物为未签名 APK。
      - name: Decode signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "$SIGNING_KEY" | base64 -d > "$GITHUB_WORKSPACE/keystore.p12"
            echo "已写入 keystore.p12（PKCS12）"
          else
            echo "未配置 SIGNING_KEY，跳过签名，产物为 app-release-unsigned.apk"
          fi

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore.p12
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon

      # 签名没生效就直接让 CI 失败，避免把装不上的 unsigned 包发到 Release 页上。
      - name: Verify APK signature
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "产物: $APK"
          case "$APK" in
            *unsigned*) echo "!! 产物未签名，签名 Secrets 未生效"; exit 1;;
          esac
          AS=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          [ -n "$AS" ] || AS=$(find /usr/local/lib/android/sdk -name apksigner -type f 2>/dev/null | sort -V | tail -1)
          [ -n "$AS" ] || { echo "找不到 apksigner"; exit 1; }
          "$AS" verify --verbose --print-certs "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk

      # 仅当以 v* tag 触发时创建 GitHub Release 并附上 APK
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
